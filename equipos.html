<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Gestor de equipos de un torneo de fútbol.">
    <meta name="author" content="Desarrollado por Romano Gabriel">
    <meta name="keywords" content="fútbol, torneos, equipos, jugadores, partidos">

    <title>Equipos - Gestor de Torneos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style/style.css">
</head>

<body>


    <header>

        <nav class="navbar navbar-expand-lg navbar-dark navbar-personalizada">

            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    <img src="img/Logo.png" alt="Logo" class="imagen-tarjeta"> Gestor de Torneos
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion"
                    aria-controls="menuNavegacion" aria-expanded="false" aria-label="Mostrar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuNavegacion">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="equipos.html">
                                Equipos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="jugadores.html">
                                Jugadores
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="partidos.html">
                                Partidos
                            </a>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>



    <main>


        <section class="container py-5">

            <div class="text-center">

                <img src="img/equipos.png" alt="Equipos" class="imagen-pagina">

                <h1 class="titulo-principal fw-bold">
                    Gestión de Equipos
                </h1>

                <p class="lead text-muted">
                    Administra los equipos participantes del torneo.
                </p>

            </div>

        </section>



        <section class="container mb-5">

            <div class="card shadow formulario-personalizado">

                <div class="card-body p-4">

                    <h2 class="h4 fw-bold titulo-principal mb-4">
                        ➕ Añadir equipo
                    </h2>

                    <div class="row g-3">

                        <div class="col-12 col-md-8">

                            <label for="inputNombreEquipo" class="form-label fw-bold">
                                Nombre del equipo
                            </label>

                            <input id="inputNombreEquipo" type="text" class="form-control"
                                placeholder="Ingrese el nombre del equipo">

                        </div>


                        <div class="col-12 col-md-4">

                            <label for="inputColorEquipo" class="form-label fw-bold">
                                Color del equipo
                            </label>

                            <input id="inputColorEquipo" type="color" class="form-control form-control-color"
                                value="#176b3a">

                        </div>


                        <div class="col-12">

                            <button id="btnAgregarEquipo" class="btn btn-success boton-personalizado"
                                onclick="agregarEquipo()">
                                + Agregar Equipo
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>



        <section class="container mb-5">

            <div class="card shadow tabla-personalizada">

                <div class="card-body p-4">

                    <h2 class="h4 fw-bold titulo-principal mb-4">
                        Equipos registrados
                    </h2>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead class="table-success">

                                <tr>
                                    <th>ID</th>
                                    <th>Nombre del Equipo</th>
                                    <th>Color</th>
                                    <th>Cantidad de jugadores</th>
                                    <th>Acciones</th>
                                </tr>

                            </thead>

                            <tbody id="tablaEquipos">
                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </section>


        <section class="container pb-5">

            <a href="index.html" class="btn btn-secondary">
                ← Volver al inicio
            </a>

        </section>

    </main>



    <footer class="footer-personalizado">

        <div class="container text-center">

            <p class="mb-0">
                © 2026 - Gestor de Torneos de Fútbol Murak
            </p>

        </div>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/equipos.js"></script>
</body>

</html>
